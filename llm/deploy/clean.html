<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浩的 AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6f7;
    height: 100vh;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 720px; height: 100vh;
    background: #fff;
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 10px;
  }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold;
  }
  header h1 { font-size: 18px; color: #111827; }
  header p { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; max-width: 85%; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px;
    line-height: 1.6; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; justify-content: flex-end; }
  .msg.user .bubble {
    background: #2563eb; color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant .bubble {
    background: #f1f2f4; color: #1f2937;
    border-bottom-left-radius: 3px;
  }
  #inputRow {
    display: flex; gap: 10px; padding: 14px 16px;
    border-top: 1px solid #e5e7eb; background: #fff;
  }
  #input {
    flex: 1; padding: 11px 16px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  button {
    padding: 11px 20px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:active { background: #1e40af; }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="logo">浩</div>
    <div>
      <h1>浩的 AI</h1>
      <p>Qwen2.5-1.5B · 微调模型</p>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="input" placeholder="输入你的问题，按回车发送...">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
const history = [];  // 保存对话历史，支持多轮
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  addMsg('assistant', '...正在思考...');

  const resp = await fetch('/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'qwen15-finetuned', messages: history })
  });
  const data = await resp.json();
  const answer = data.choices[0].message.content;
  chatEl.lastChild.remove();  // 删掉"正在思考..."
  addMsg('assistant', answer);
  history.push({ role: 'assistant', content: answer });
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
